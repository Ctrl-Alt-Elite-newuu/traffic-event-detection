# Live-demo API image: built on every push to dev/main and on pull requests (so a broken
# Dockerfile is caught before merging), but only published to GHCR and rolled out to the
# team server after a merge into main. The deploy job additionally waits for the repository
# variable DEPLOY_ENABLED to be "true" (see deploy/README.md for the secrets and variables).
name: Demo API image and deploy

on:
  push:
    branches: [main, dev]
    paths: ["solution.py", "src/**", "weights/**", "demo/**", "deploy/**", "requirements.txt", ".github/workflows/deploy-demo.yml"]
  pull_request:
    branches: [main]
    paths: ["solution.py", "src/**", "weights/**", "demo/**", "deploy/**", "requirements.txt", ".github/workflows/deploy-demo.yml"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/ctrl-alt-elite-newuu/traffic-event-detection-demo
  IS_RELEASE: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: env.IS_RELEASE == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: demo/Dockerfile
          push: ${{ env.IS_RELEASE == 'true' }}
          tags: ${{ env.IMAGE }}:latest,${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read          # the image stays private; the server pulls it with this job's token
    steps:
      - uses: actions/checkout@v7
      - name: Copy compose files to the server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: deploy/docker-compose.yml
          target: ${{ vars.DEPLOY_DIR }}
          strip_components: 1
      - name: Pull and restart
        uses: appleboy/ssh-action@v1.2.5
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # short-lived: expires when this job ends
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            cd ${{ vars.DEPLOY_DIR }}
            printf 'DOMAIN=%s\nDEMO_TAG=%s\n' '${{ vars.DOMAIN }}' '${{ github.sha }}' > .env
            trap 'docker logout ghcr.io >/dev/null 2>&1' EXIT      # never leave credentials on the server
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull
            docker logout ghcr.io
            docker compose up -d --remove-orphans
            docker image prune -f
