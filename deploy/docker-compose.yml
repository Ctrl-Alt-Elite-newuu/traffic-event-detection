# Live-demo API on the team server. The server's existing Caddy (which also serves other sites)
# terminates HTTPS, serves the website from SITE_DIR and proxies /api to this container; see
# deploy/caddy-site.caddy. Values come from deploy/.env, written by the deploy workflow.
services:
  demo:
    image: ghcr.io/ctrl-alt-elite-newuu/traffic-event-detection-demo:${DEMO_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8000"      # only reachable from the server itself (Caddy)
    environment:
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-300}
      MAX_DURATION_SEC: ${MAX_DURATION_SEC:-120}
      CORS_ORIGINS: https://${DOMAIN}
    volumes:
      - demo-jobs:/data/jobs

volumes:
  demo-jobs:
